# Keeps the pins moving for the two things that decide whether the engine is
# safe to trade: the runtime libraries that parse market data, and the actions
# that run the gates. Dependabot PRs go through the same CI as any other commit.
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Runtime libraries are audited by pip-audit and gated by the readiness
      # run, so they land as one reviewable PR.
      runtime:
        patterns: ["PyYAML", "pybind11", "websockets"]
      # Test/lint/coverage tooling cannot change engine behaviour.
      tooling:
        patterns: ["pytest", "pytest-cov", "flake8", "pip-audit"]
    # The supported floor is CPython 3.9 -- README "Requirements", the py3.9 CI
    # leg, and the interpreter the built extension is tagged for. These majors
    # raise it (verified against the wheels' Requires-Python, not guessed), so a
    # bump cannot go green while the floor stands, and reopening one re-derives
    # the same red leg every week. Raise the floor in CI, the docs and the built
    # .so together, then delete the matching rule here.
    ignore:
      # pytest 9, flake8 7.4 and pip-audit 2.10 all require >= 3.10.
      - dependency-name: pytest
        versions: [">=9"]
      - dependency-name: flake8
        versions: [">=7.4"]
      - dependency-name: pip-audit
        versions: [">=2.10"]
      # websockets 16 requires >= 3.10 and 17 requires >= 3.11.
      - dependency-name: websockets
        versions: [">=16"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
