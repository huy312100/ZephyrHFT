name: Testnet pilot

# Two layers, on purpose:
#
#   offline — the client + pilot suite with a fake transport. No network, no
#             credentials; runs on every change to the exchange surface.
#   live    — a manual dispatch against Binance Futures **testnet** using
#             repository secrets. It is never scheduled: a venue outage, a
#             testnet reset or a geo-blocked runner must not turn a green board
#             red overnight. A human dispatches it before promoting a change.
#
# The offline job always runs first; the live job only starts when it is green.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "python_analytics/exchange/**"
      - "python_analytics/utils/config.py"
      - "scripts/run_testnet_pilot.py"
      - "tests/python/test_binance_testnet.py"
      - "requirements.txt"
      - ".github/workflows/testnet-pilot.yml"
  pull_request:
    branches: [main]
    paths:
      - "python_analytics/exchange/**"
      - "python_analytics/utils/config.py"
      - "scripts/run_testnet_pilot.py"
      - "tests/python/test_binance_testnet.py"
      - "requirements.txt"
      - ".github/workflows/testnet-pilot.yml"
  workflow_dispatch:
    inputs:
      order-test:
        description: "none = read-only, dry-run = build/validate, submit = place -> query -> cancel"
        type: choice
        options: [none, dry-run, submit]
        default: dry-run
      confirm-submit:
        description: "Required when order-test=submit (places a real testnet order)"
        type: boolean
        default: false
      skip-l2:
        description: "Skip the depth WebSocket probe (REST-only hosts)"
        type: boolean
        default: false
      l2-seconds:
        description: "Depth sampling window in seconds"
        default: "5"
      min-ticks:
        description: "Minimum L2 frames for the check to pass"
        default: "5"
      symbol:
        description: "Futures symbol"
        default: "BTCUSDT"
      quantity:
        description: "Limit-order quantity in base units"
        default: "0.001"
      runner:
        description: "Runner label; use a self-hosted label if Binance geo-blocks GitHub IPs (HTTP 451)"
        default: "ubuntu-24.04"

concurrency:
  group: testnet-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"


jobs:
  offline:
    name: offline pilot tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Same invocation as ci.yml so the two workflows cannot drift into
      # disagreeing about what "lint clean" means.
      - name: flake8
        run: python -m flake8 --count --statistics python_analytics scripts tests main.py

      # The fake transport keeps this suite hermetic: no keys, no sockets.
      - name: Run the offline pilot suite
        run: python -m pytest tests/python/test_binance_testnet.py

      - name: CLI smoke test
        run: python scripts/run_testnet_pilot.py --help

      # The no-credential path must exit 2 (configuration error), not 1 and not
      # a traceback. It is the first thing a new operator hits.
      - name: Verify the missing-credentials guard
        run: |
          set +e
          env -u BINANCE_API_KEY -u BINANCE_API_SECRET \
            python scripts/run_testnet_pilot.py --skip-l2 > /tmp/no-creds.log 2>&1
          rc=$?
          cat /tmp/no-creds.log
          test "$rc" -eq 2

  live:
    name: live testnet (manual dispatch)
    needs: offline
    if: github.event_name == 'workflow_dispatch'
    # The `testnet` environment is where the secrets live and where a reviewer
    # rule can be attached. Keep production credentials out of this repository.
    environment: testnet
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 10
    env:
      BINANCE_ENV: testnet
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      SYMBOL: ${{ github.event.inputs.symbol }}
      QUANTITY: ${{ github.event.inputs.quantity }}
      ORDER_TEST: ${{ github.event.inputs.order-test }}
      CONFIRM_SUBMIT: ${{ github.event.inputs.confirm-submit }}
      SKIP_L2: ${{ github.event.inputs.skip-l2 }}
      L2_SECONDS: ${{ github.event.inputs.l2-seconds }}
      MIN_TICKS: ${{ github.event.inputs.min-ticks }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      # Never echo the values: the pilot masks the key, and this step only
      # reports presence. `submit` additionally requires the explicit boolean,
      # so a mis-clicked dispatch cannot place an order.
      - name: Guard credentials and destructive input
        run: |
          if [ -z "$BINANCE_API_KEY" ] || [ -z "$BINANCE_API_SECRET" ]; then
            echo "::error::BINANCE_API_KEY and BINANCE_API_SECRET are not set on the 'testnet' environment."
            echo "Add them under Settings -> Environments -> testnet -> Environment secrets."
            exit 1
          fi
          if [ "$ORDER_TEST" = "submit" ] && [ "$CONFIRM_SUBMIT" != "true" ]; then
            echo "::error::order-test=submit requires confirm-submit=true."
            exit 1
          fi
          if [ "$ORDER_TEST" = "submit" ]; then
            echo "::warning::This run will place a real order on the Binance Futures testnet."
          fi

      # Binance returns 451 from restricted regions. GitHub-hosted runners are
      # usually fine, but the failure mode is opaque without this preflight, so
      # it names the escape hatch (dispatch with a self-hosted runner label).
      - name: Preflight testnet reachability
        run: |
          code=$(curl -sS --max-time 20 --retry 2 --retry-delay 2 \
            -o /tmp/ping.json -w '%{http_code}' \
            https://testnet.binancefuture.com/fapi/v1/ping || true)
          echo "testnet /fapi/v1/ping -> HTTP ${code:-000}"
          if [ "${code:-000}" = "451" ]; then
            echo "::error::Binance rejected this runner's region (HTTP 451). Re-dispatch with runner=<self-hosted label>."
            exit 1
          fi
          if [ "${code:-000}" != "200" ]; then
            echo "::error::testnet ping failed (HTTP ${code:-000}): $(head -c 300 /tmp/ping.json 2>/dev/null)"
            exit 1
          fi

      - name: Run the pilot
        run: |
          set -o pipefail
          mkdir -p pilot-output
          args=(
            --symbol "$SYMBOL"
            --quantity "$QUANTITY"
            --order-test "$ORDER_TEST"
            --l2-seconds "$L2_SECONDS"
            --min-ticks "$MIN_TICKS"
          )
          if [ "$SKIP_L2" = "true" ]; then
            args+=(--skip-l2)
          fi
          python scripts/run_testnet_pilot.py "${args[@]}" | tee pilot-output/pilot.log

      - name: Publish the verdict to the job summary
        if: always()
        run: |
          {
            echo "### Testnet pilot — ${ORDER_TEST} — ${SYMBOL}"
            echo
            echo '```'
            grep -E 'PASS |FAIL |SKIP |verdict:' pilot-output/pilot.log || echo "no pilot output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pilot log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testnet-pilot-log
          path: pilot-output/pilot.log
          if-no-files-found: warn
          retention-days: 14
