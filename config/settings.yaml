# Runtime configuration for the engine, risk guard and demo strategy.
engine:
  symbol: BTCUSDT
  # Price grid of the direct-indexed ladder. These two values are the *synthetic*
  # world the committed sample archive and its locked artefacts live in. A real
  # BTCUSDT-perp capture ticks at 0.10 and trades near 80k, so replay it with the
  # venue lock instead: scripts/run_walk_forward.py --from-lock \
  #   --lock-file config/venue_binance_futures_btcusdt.json. The ladder re-anchors
  # on the feed by itself, but a tick that does not divide the venue's prices is
  # reported (book: N unpriced frames) rather than silently guessed around.
  tick_size: "0.50"
  center: "30000"
  stale_after_ns: 1000000000
  risk:
    max_order_quantity: "10"
    max_order_notional: "250000"
    max_position_notional: "1000000"
    max_daily_loss: "25000"
    max_price_deviation: "500"
    max_open_orders: 64
  # Order-flow / fat-finger guards (native RiskManager, token bucket rate limit).
  # Enable for live and paper execution; leave off for deterministic replay.
  pretrade:
    enabled: false
    max_position: "10"            # base units, signed net exposure cap
    max_order_size: "1"           # base units per order
    max_price_deviation_pct: "0.01"   # 1% band around the BBO mid
    order_rate_limit: 50          # orders / second
    order_burst: 20               # token bucket depth

# Emergency kill switch (native KillSwitch). While TRIGGERED every order is
# refused, resting orders are cancelled and the position is flattened through
# the registered hooks. `enabled` arms only the automatic guards; a manual
# trip always wins.
kill_switch:
  enabled: true
  max_drawdown_limit: "25000"     # quote currency; 0 disables the drawdown guard
  max_consecutive_rejects: 10     # trip after N rejects in a row; 0 disables

# Phase 1 real-time L2 ingestion (`scripts/ingest_l2.py`).
# Subscribes to an exchange depth stream and persists the raw frames as
# gzip-compressed NDJSON roll files under `storage_path` (created on demand).
data_ingestion:
  enabled: true
  exchange: binance_futures        # binance_futures | binance_futures_testnet | binance_spot
  symbol: btcusdt                  # lowercase, as required by the stream name
  stream_type: depth@100ms         # e.g. depth@100ms, depth@500ms, depth20@100ms
  # Extra streams on the same socket (combined-stream form). The tape is what
  # separates "our quote was hit" from "the book crossed us" -- without prints
  # every backtested fill is adversarially selected by construction. ``trade`` is
  # the stream that actually delivers on this endpoint (@aggTrade is silently
  # empty); ``--aux-stream aggTrade`` still works if a venue serves it.
  aux_streams: [trade]            # e.g. [trade, markPrice@1s], [] = depth only
  storage_path: data/raw_l2        # relative to the repository root
  compression: gzip                # gzip | none
  compression_level: 1             # 1 = fastest (ingest path), 9 = smallest
  flush_interval_ms: 250           # max time a record waits in the write buffer
  max_file_mb: 256                 # rotate the roll file at this size (0 = never)
  rotate_seconds: 900              # ... or after this many seconds (0 = never)
  telemetry_interval_s: 10.0       # latency / throughput summary cadence
  latency_warn_ms: 250.0           # WARNING when feed latency exceeds this
  reconnect_base_delay_s: 0.5      # exponential backoff: 0.5, 1, 2, 4 ... capped
  reconnect_max_delay_s: 30.0
  max_reconnect_attempts: 0        # 0 = retry forever
  ws_base_url: ""                  # optional override of the exchange endpoint

strategy:
  name: inventory_market_maker
  half_spread_ticks: 2
  order_quantity: "0.05"
  max_inventory: "1.0"
  skew_ticks: 1
  # Phase 3 Avellaneda-Stoikov parameters (consumed by scripts/run_backtest.py
  # and the optimizer). ``ofi_sensitivity`` scales the OFI z-score into a
  # reservation-price shift; ``use_time_spread`` enables the gamma*sigma^2*(T-t)
  # term in the optimal spread.
  market_maker:
    gamma: 0.1
    sigma: 0.02
    k: 1.5
    time_horizon: 60.0
    inventory_limit: 5.0
    ofi_sensitivity: 0.0
    ofi_decay: 0.95
    ofi_cap: 3.0
    use_time_spread: true

backtest:
  event_limit: 100000
  record_fills: true
  # Phase 3 bulk-replay defaults. Fee/rebate rates are fractional basis points
  # (0.5 == 0.5 bps); a negative maker_bps is a rebate. The defaults are the
  # retail Binance USD-M VIP 0 schedule: makers PAY 2 bps, takers 5 bps.
  maker_bps: 2.0
  taker_bps: 5.0
  initial_cash: 100000.0
  batch_size: 64
  frames_per_hook: 1
  report_dir: data/backtests/latest

# Phase 3 forward paper trading / backtesting runtime (see
# docs/phase3_backtesting_architecture.md). Not read by load_settings(); kept as
# the single source of truth for the CLI defaults documented there.
paper_trading:
  tick_size: "0.1"
  center: "84570"
  # Fractional basis points are supported (0.5 == 0.5 bps). Retail VIP 0 pays
  # 2 bps as a maker; only an explicit rebate tier may go negative.
  maker_bps: 2.0
  taker_bps: 5.0
  initial_cash: 100000.0
  order_quantity: "0.01"
